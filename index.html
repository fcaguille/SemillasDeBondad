<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F9F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Semillas" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <script>
      /*
       * Runs before the bundle. The app uses hash routes (#/p/SB-1234), so rewrite:
       *  - legacy path links  /p/SB-1234        -> /#/p/SB-1234
       *  - external returns   /?ruta=pago/retorno&status=... -> /#/pago/retorno?status=...
       *  - query added outside the hash (Mercado Pago)  -> moved into the hash route
       */
      (function () {
        try {
          var l = window.location;
          var rutas =
            /\/(p\/[^/?#]+|impacto|crear-maceta|ranking|escanear|historial|cuenta|registro|pago\/retorno)\/?$/;
          var params = new URLSearchParams(l.search);
          var hashRuta = l.hash.indexOf("#/") === 0;
          var raiz = l.pathname;
          var destino = null;
          var m = l.pathname.match(rutas);
          if (m) {
            raiz = l.pathname.slice(0, m.index + 1);
            destino = hashRuta ? l.hash.slice(1) : "/" + m[1];
          } else if (params.get("ruta")) {
            destino = "/" + params.get("ruta").replace(/^\/+/, "");
            params.delete("ruta");
          } else if (l.search && hashRuta) {
            destino = l.hash.slice(1);
          }
          if (!destino) return;
          var partes = destino.split("?");
          new URLSearchParams(partes[1] || "").forEach(function (v, k) {
            params.set(k, v);
          });
          var qs = params.toString();
          l.replace(raiz + "#" + partes[0] + (qs ? "?" + qs : ""));
        } catch (e) {
          /* never block boot */
        }
      })();
    </script>
    <script>
      /* Boot fallback: if the bundle fails to download or hangs, show a retry button. */
      (function () {
        var pendiente = null;
        function fallo(texto) {
          var msg = document.getElementById("boot-msg");
          var btn = document.getElementById("boot-retry");
          if (!msg || !btn) {
            if (document.readyState === "loading") pendiente = texto; // #root not parsed yet
            return; // otherwise React already mounted
          }
          msg.textContent = texto;
          btn.hidden = false;
        }
        document.addEventListener("DOMContentLoaded", function () {
          if (pendiente) fallo(pendiente);
        });
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            var url = (t && (t.src || t.href)) || "";
            // Only our own bundle/styles matter (ignore third-party fonts, analytics).
            if (url.indexOf(location.origin) === 0 && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
              fallo("No pudimos descargar la aplicación. Revisa tu conexión e inténtalo de nuevo.");
            }
          },
          true,
        );
        setTimeout(function () {
          fallo("La app está tardando en cargar. Revisa tu conexión e inténtalo de nuevo.");
        }, 15000);
      })();
    </script>
    <style>
      #boot {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f8f9f7;
        color: #141a16;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #boot .boot-card {
        text-align: center;
        padding: 24px;
        max-width: 340px;
      }
      #boot .boot-dot {
        width: 48px;
        height: 48px;
        margin: 0 auto;
        border-radius: 16px;
        background: linear-gradient(135deg, #22a34f, #15803d);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot p {
        margin: 14px 0 0;
        font-size: 14px;
        line-height: 20px;
        color: #5f6b62;
      }
      #boot button {
        margin-top: 16px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #15803d;
        color: #fff;
        font: 600 15px/1 inherit;
        cursor: pointer;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(1.08);
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root">
      <!-- Replaced by React on mount; visible only while the bundle loads or if it fails. -->
      <div id="boot" role="status">
        <div class="boot-card">
          <div class="boot-dot" aria-hidden="true"></div>
          <p id="boot-msg">Cargando Semillas de Bondad…</p>
          <button id="boot-retry" type="button" hidden onclick="location.reload()">
            Recargar aplicación
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
